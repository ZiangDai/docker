name: 'odoo-local'
services:
  postgres:
    build:
      context: ./postgresql
      dockerfile: Dockerfile
      args:
        POSTGRES_USER: odoo
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    container_name: odoo-database
    restart: no
    env_file:
      - .env
    volumes:
      - odoo-database-volume:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: '2.5gb'
        reservations:
          cpus: '0.25'
          memory: '20mb'
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
    ports:
      - ${POSTGRES_PORT}:5432

  odoo:
    build:
      context: ./odoo
      dockerfile: Dockerfile
    container_name: odoo-backend
    restart: no
    volumes:
      - ./odoo/extra-addons:/mnt/extra-addons:ro
      - ./odoo/enterprise-addons:/mnt/enterprise-addons:ro
      - ./odoo/config:/etc/odoo:ro
    env_file:
      - .env
    environment:
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
      PASSWORD: ${POSTGRES_PASSWORD}
      USER: odoo
      PORT: ${POSTGRES_PORT}
      HOST: postgres
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: '2gb'
        reservations:
          cpus: '0.25'
          memory: '20mb'
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
    depends_on:
      - postgres
    links:
      - postgres
    ports:
      - ${ODOO_XMLRPC_PORT}:8069
      - ${ODOO_LONG_POLLING_PORT}:8072

volumes:
  odoo-database-volume:
    driver: local
